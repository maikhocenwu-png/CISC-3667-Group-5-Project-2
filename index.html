<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Picture Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game">
      <!-- Start screen -->
      <div id="start">
        <h1>Landmark Guesser</h1>
        <p>Pick a difficulty level to start the game!</p>
        <button id="easyBtn" class="bigButton" type="button">
          Easy<small>Multiple choice</small>
        </button>
        <button id="hardBtn" class="bigButton" type="button">
          Hard<small>Type the answer</small>
        </button>
      </div>

      <!-- Game screen -->
      <div id="play" class="hidden">
        <div id="status">
          <span id="total">1/5</span> · <span id="score">0</span>
        </div>
        <img id="picture" src="" alt="Landmark picture" />
        <div id="options"></div>
        <p id="feedback"></p>
      </div>

      <!-- Map screen: drop a pin -->
      <div id="mapPage" class="hidden">
        <h2 id="mapQuestion"></h2>
        <div id="mapwrap">
          <svg id="map" role="img" aria-label="World map. Click to place your guess."></svg>
          <div class="zoom">
            <button type="button" id="zin" aria-label="Zoom in">+</button>
            <button type="button" id="zout" aria-label="Zoom out">-</button>
            <button type="button" id="zreset" aria-label="Reset view">&#10558;</button>
          </div>
        </div>
        <p id="mapInfo"></p>
        <button id="confirm" class="actionBtn" type="button" disabled>Confirm pin</button>
        <button id="nextRound" class="actionBtn hidden" type="button">Next landmark</button>
      </div>

      <!-- End screen -->
      <div id="end" class="hidden">
        <h2>Game over!</h2>
        <p id="finalScore"></p>
        <button id="again" type="button">Play again</button>
      </div>
    </main>

    <script src="landmarks.js"></script>
    <script src="worldMap.js"></script>
    <script src="game.js"></script>
    <script src="mapLabels.js"></script>
  </body>
</html>
