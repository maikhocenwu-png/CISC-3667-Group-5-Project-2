<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landmark Guesser</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game">
      <!-- Start screen -->
      <div id="start">
        <h1>Landmark Guesser</h1>
        <p>Choose a game length:</p>
            <div id="lengthRow">
             <button id="quickBtn" class="lengthBtn selected" type="button">
                Quick<small>5 rounds</small>
                </button>
                <button id="regularBtn" class="lengthBtn" type="button">
                 Regular<small>10 rounds</small>
                </button>
            </div>
        <p>Pick a difficulty level to start the game!</p>
        <button id="easyBtn" class="bigButton" type="button">
          Easy<small>Multiple choice</small>
        </button>
        <button id="hardBtn" class="bigButton" type="button">
          Hard<small>Type the answer & no country name in pin the map</small>
        </button>
        <button id="howBtn" class="bigButton" type="button">
            How to play<small> Tutorial </small>
        </button>    
      </div>

      <!-- Tutorial screen -->
    <div id="tutorial" class="hidden">
        <h2 id="tutTitle"></h2>
        <p id="tutText"></p>
        <p id="tutCount"></p>
        <button id="tutBack" class="actionBtn" type="button">Back</button>
        <button id="tutNext" class="actionBtn" type="button">Next</button>
    </div>

      <!-- Game screen -->
      <div id="play" class="hidden">
        <div id="status">
          <span id="total">1/5</span> · <span id="score">0</span>
        </div>
        <img id="picture" src="" alt="Landmark picture" />
        <div id="options"></div>
        <div id="hintBox" class="hidden">
          <p id="hintText"></p>
          <button id="hintBtn" class="actionBtn" type="button"></button>
        </div>
        <p id="feedback"></p>
        <button id="toMap" class="actionBtn hidden" type="button">Continue to map</button>
      </div>

      <!-- Map screen: drop a pin -->
      <div id="mapPage" class="hidden">
        <h2 id="mapQuestion"></h2>
        <div id="mapwrap">
          <svg id="map" role="img" aria-label="World map. Click to place your guess."></svg>
          <div class="zoom">
            <button type="button" id="zin" aria-label="Zoom in">+</button>
            <button type="button" id="zout" aria-label="Zoom out">-</button>
            <button type="button" id="zreset" aria-label="Reset view">&#10558;</button>
          </div>
        </div>
        <p id="mapInfo"></p>
        <button id="areaHintBtn" class="actionBtn hidden" type="button"></button>
        <button id="confirm" class="actionBtn" type="button" disabled>Confirm pin</button>
        <button id="nextRound" class="actionBtn hidden" type="button">Next landmark</button>
      </div>

      <!-- Info screen: fun fact + history -->
      <div id="infoPage" class="hidden">
        <h2 id="infoName"></h2>
        <p id="infoPlace"></p>
        <img id="infoPicture" src="" alt="" />
        <p id="infoFact"></p>
        <h3>History</h3>
        <p id="infoHistory"></p>
        <ul id="infoKeyFacts"></ul>
        <button id="infoNext" class="actionBtn" type="button">Next landmark</button>
      </div>

      <!-- End screen -->
      <div id="end" class="hidden">
        <h2>Game over!</h2>
        <p id="finalScore"></p>
        <div id="summary"></div>
        <button id="again" type="button">Play again</button>
      </div>
    </main>

    <script src="landmarks.js"></script>
    <script src="worldMap.js"></script>
    <script src="game.js"></script>
    <script src="mapLabels.js"></script>
  </body>
</html>
